[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llm-training"
version = "0.1.0"
description = "Experimental language-model pretraining, scaling, GPU systems, and reasoning RL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Naveen Kannan"}]
dependencies = [
  "einops>=0.8",
  "numpy>=2.0",
  "regex>=2024.11",
  "torch>=2.5",
  "tqdm>=4.67",
]

[project.optional-dependencies]
systems = ["einx>=0.3", "jaxtyping>=0.3", "pandas>=2", "psutil>=6", "humanfriendly>=10", "matplotlib>=3.9", "triton>=3; sys_platform == 'linux'"]
data = ["fasttext>=0.9.2", "fastwarc>=0.14", "mmh3>=5", "beautifulsoup4>=4.12", "transformers>=4.50", "modal>=1"]
posttraining = ["accelerate>=1.5", "transformers>=4.50", "math-verify[antlr4-13-2]>=0.7.0", "pylatexenc>=2.10", "sympy>=1.13", "latex2sympy2-extended", "xopen>=2", "wandb>=0.19", "vllm>=0.8; sys_platform == 'linux'"]
analysis = ["matplotlib>=3.9", "scipy>=1.14"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/Naveen-Kannan/llm-training"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
# Jaxtyping shape strings are not Python forward-reference expressions.
ignore = ["F722"]
